name: 'Profile Readme Development Stats'
author: Anmol Pratap Singh
description: 'Are you an early 🐤 or a night 🦉? When are you most productive during the day? Check out in your readme!'

inputs:
  GH_TOKEN:
    description: 'GitHub access token with Repo scope'
    required: true
    default: ${{ github.token }}

  PUSH_TOKEN:
    description: 'GitHub token used for git authentication (clone/remote URL/push). To prevent polluting your activity feed, pass the workflow GitHub token and ensure your workflow has contents write permission.'
    required: false
    default: ${{ github.token }}

  WAKATIME_API_KEY:
    description: 'Your Wakatime API Key'
    required: true
  
  WAKATIME_API_URL:
    description: 'Your Wakatime API URL'
    required: false
    default: "https://wakatime.com/api/v1/"

  SECTION_NAME:
    description: 'Name used in readme to scope the updated section'
    required: false
    default: "waka"

  PULL_BRANCH_NAME:
    required: false
    description: "The branch to get the readme from"
    default: ""

  PUSH_BRANCH_NAME:
    required: false
    description: "The branch to update the readme in"
    default: ""

  SHOW_OS:
    required: false
    description: 'Show the list of OS Worked on In dev metrics'
    default: "True"

  SHOW_PROJECTS:
    required: false
    description: 'Show the list of projects worked on in dev metrics'
    default: "True"

  SHOW_EDITORS:
    required: false
    description: 'Show the Editors used in dev metrics'
    default: "True"

  SHOW_TIMEZONE:
    required: false
    description: 'Show the time zone in the dev metrics'
    default: "True"

  SHOW_COMMIT:
    required: false
    description: "Shows the number of commit graph in the dev metrics"
    default: "True"

  SHOW_LANGUAGE:
    required: false
    description: "Show the Coding language used in dev metrics"
    default: "True"

  SHOW_LINES_OF_CODE:
    required: false
    description: "Show the Total Lines of code written Badge till date"
    default: "False"

  SHOW_LANGUAGE_PER_REPO:
    required: false
    description: "Show language or framework used across different repository"
    default: "True"

  SHOW_LOC_CHART:
    required: false
    description: ""
    default: "True"

  SHOW_DAYS_OF_WEEK:
    required: false
    description: "show day of week you are most productive"
    default: "True"

  SHOW_PROFILE_VIEWS:
    required: false
    description: "Shows the current profile views"
    default: "True"

  SHOW_SHORT_INFO:
    required: false
    description: "Shows the short facts"
    default: "True"

  SHOW_UPDATED_DATE:
    required: false
    description: "Show updated date"
    default: "True"

  SHOW_TOTAL_CODE_TIME:
    required: false
    description: "Show Total Time you have coded"
    default: "True"

  SHOW_AI_CODE_TIME:
    required: false
    description: "Show the all-time AI Code Time badge"
    default: "True"

  SHOW_AI_CODING:
    required: false
    description: "Show the weekly AI coding breakdown (AI vs human lines, cost, model breakdown, sessions)"
    default: "True"

  COMMIT_BY_ME:
    required: false
    description: "Git commit with your own name and email"
    default: "False"
  
  COMMIT_MESSAGE:
    required: false
    description: "Git commit message"
    default: "Updated with Dev Metrics"

  COMMIT_USERNAME:
    required: false
    description: "Git commit custom username"
    default: ""
  
  COMMIT_EMAIL:
    required: false
    description: "Git commit custom email"
    default: ""

  COMMIT_SINGLE:
    required: false
    description: "Erase commit history on each commit"
    default: "False"

  LOCALE:
    required: false
    description: "Show stats in your own language"
    default: "en"

  UPDATED_DATE_FORMAT:
    required: false
    description: "Updated date format"
    default: "%d/%m/%Y %H:%M:%S"

  IGNORED_REPOS:
    required: false
    description: "Repos you don't want to be counted"
    default: ""

  MAX_REPOS:
    required: false
    description: "Maximum number of GitHub repositories to fetch (0 = unlimited)"
    default: "0"

  MAX_CAP:
    required: false
    description: "(Deprecated) Alias for MAX_REPOS"
    default: "0"

  SYMBOL_VERSION:
    required: false
    description: "Version of the symbol block and empty of the progress bar"
    default: "1"

  BADGE_STYLE:
    required: false
    description: "Style for the badge maker (flat, flat-square, plastic, for-the-badge, social)"
    default: "flat"

  FORCE_ADD:
    required: false
    description: "Whether to override repository .gitignore file while committing the assets"
    default: "False"

  BAR_STYLE:
    required: false
    description: "Whether the bar should be SVG or Unicode text"
    default: "text"

  BAR_COLOR:
    required: false
    description: "Hex color for the filled portion of the SVG bar"
    default: "#90CAF9"

  BAR_TRACK_COLOR:
    required: false
    description: "Hex color for the background track of the SVG bar"
    default: "#172F45"

  BAR_RADIUS:
    required: false
    description: "Border radius for rounded corners of the SVG bar"
    default: "0"

  TEXT_PRIMARY_COLOR:
    required: false
    description: "Hex color for primary SVG list text (e.g. language names)"
    default: "#c9d1d9"

  TEXT_SECONDARY_COLOR:
    required: false
    description: "Hex color for secondary SVG list text (e.g. times, percentages)"
    default: "#8b949e"

  DEBUG_LOGGING:
    required: false
    description: "Whether to enable action debug logging"
    default: ${{ runner.debug }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python 🐍
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache-dependency-path: ${{ github.action_path }}/requirements.txt

    - name: Install Dependencies 📥
      shell: bash
      run: pip install -r ${{ github.action_path }}/requirements.txt

    - name: Run Action 🧪
      shell: bash
      run: python3 ${{ github.action_path }}/sources/main.py
      env:
        INPUT_GH_TOKEN: ${{ inputs.GH_TOKEN }}
        INPUT_PUSH_TOKEN: ${{ inputs.PUSH_TOKEN }}
        INPUT_WAKATIME_API_KEY: ${{ inputs.WAKATIME_API_KEY }}
        INPUT_WAKATIME_API_URL: ${{ inputs.WAKATIME_API_URL }}
        INPUT_SECTION_NAME: ${{ inputs.SECTION_NAME }}
        INPUT_PULL_BRANCH_NAME: ${{ inputs.PULL_BRANCH_NAME }}
        INPUT_PUSH_BRANCH_NAME: ${{ inputs.PUSH_BRANCH_NAME }}
        INPUT_SHOW_OS: ${{ inputs.SHOW_OS }}
        INPUT_SHOW_PROJECTS: ${{ inputs.SHOW_PROJECTS }}
        INPUT_SHOW_EDITORS: ${{ inputs.SHOW_EDITORS }}
        INPUT_SHOW_TIMEZONE: ${{ inputs.SHOW_TIMEZONE }}
        INPUT_SHOW_COMMIT: ${{ inputs.SHOW_COMMIT }}
        INPUT_SHOW_LANGUAGE: ${{ inputs.SHOW_LANGUAGE }}
        INPUT_SHOW_LINES_OF_CODE: ${{ inputs.SHOW_LINES_OF_CODE }}
        INPUT_SHOW_LANGUAGE_PER_REPO: ${{ inputs.SHOW_LANGUAGE_PER_REPO }}
        INPUT_SHOW_LOC_CHART: ${{ inputs.SHOW_LOC_CHART }}
        INPUT_SHOW_DAYS_OF_WEEK: ${{ inputs.SHOW_DAYS_OF_WEEK }}
        INPUT_SHOW_PROFILE_VIEWS: ${{ inputs.SHOW_PROFILE_VIEWS }}
        INPUT_SHOW_SHORT_INFO: ${{ inputs.SHOW_SHORT_INFO }}
        INPUT_SHOW_UPDATED_DATE: ${{ inputs.SHOW_UPDATED_DATE }}
        INPUT_SHOW_TOTAL_CODE_TIME: ${{ inputs.SHOW_TOTAL_CODE_TIME }}
        INPUT_SHOW_AI_CODE_TIME: ${{ inputs.SHOW_AI_CODE_TIME }}
        INPUT_SHOW_AI_CODING: ${{ inputs.SHOW_AI_CODING }}
        INPUT_COMMIT_BY_ME: ${{ inputs.COMMIT_BY_ME }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.COMMIT_MESSAGE }}
        INPUT_COMMIT_USERNAME: ${{ inputs.COMMIT_USERNAME }}
        INPUT_COMMIT_EMAIL: ${{ inputs.COMMIT_EMAIL }}
        INPUT_COMMIT_SINGLE: ${{ inputs.COMMIT_SINGLE }}
        INPUT_LOCALE: ${{ inputs.LOCALE }}
        INPUT_UPDATED_DATE_FORMAT: ${{ inputs.UPDATED_DATE_FORMAT }}
        INPUT_IGNORED_REPOS: ${{ inputs.IGNORED_REPOS }}
        INPUT_MAX_REPOS: ${{ inputs.MAX_REPOS }}
        INPUT_MAX_CAP: ${{ inputs.MAX_CAP }}
        INPUT_SYMBOL_VERSION: ${{ inputs.SYMBOL_VERSION }}
        INPUT_BADGE_STYLE: ${{ inputs.BADGE_STYLE }}
        INPUT_FORCE_ADD: ${{ inputs.FORCE_ADD }}
        INPUT_BAR_STYLE: ${{ inputs.BAR_STYLE }}
        INPUT_BAR_COLOR: ${{ inputs.BAR_COLOR }}
        INPUT_BAR_TRACK_COLOR: ${{ inputs.BAR_TRACK_COLOR }}
        INPUT_TEXT_PRIMARY_COLOR: ${{ inputs.TEXT_PRIMARY_COLOR }}
        INPUT_TEXT_SECONDARY_COLOR: ${{ inputs.TEXT_SECONDARY_COLOR }}
        INPUT_BAR_RADIUS: ${{ inputs.BAR_RADIUS }}
        INPUT_DEBUG_LOGGING: ${{ inputs.DEBUG_LOGGING }}

branding:
  icon: 'activity'
  color: 'orange'

